<!DOCTYPE html>
<html>
<head>
    <title>Counter Display</title>
    <link rel="stylesheet" href="Style/display/style.css">

    <link rel="shortcut icon" href="./Images/favicon.ico">
    <link rel="icon" href="./Images/favicon_gif.gif" type="image/gif" >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--MQTT library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body onload="load()">
    <div id="loading"><div id="loadingCircle"></div></div>

    <div id="noLyrics" style="opacity: 0;">
        <div id="showCounter">
            <img id="logoSmall" src="Images/revive_logo.png">
            <span id="counter">LOADING</span>
            <span id="testCounter">LOADING</span>
        </div>

        <div id="hideCounter">
            <img id="logoBig" src="Images/revive_logo.png">
        </div>

        <span id="event">Worship</span>
        <span id="testEvent">Worship</span>
        <span id="message">S.O.S.</span>
        <span id="testMessage">M</span>
        <div id="progressBar"></div>
    </div>

    <!--a separate layout that has place for lyrics-->
    <div id="lyrics" style="opacity: 1;">
        <img id="lyricsLogo" src="Images/revive_logo.png">
        <span id="lyricsCounter">00:00:00</span>
        <span id="lyricsText">This is my desire
to worship you
        </span>
        <span id="lyricsTextTest">this is my desire</span>
    </div>

    <script src="JavaScript/constants.js"></script>
    <script src="JavaScript/counter.js"></script>
    <script src="JavaScript/display/receiver.js"></script>
    <script src="JavaScript/display/style.js"></script>
    <script src="JavaScript/display/main.js"></script>
</body>
</html>
