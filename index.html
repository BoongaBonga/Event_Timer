<!DOCTYPE html>
<html>
<head>
  <title>Counter Control</title>

  <link rel="stylesheet" href="Style/main/style.css">
  <link rel="stylesheet" href="Style/main/timerList.css">

  <link rel="shortcut icon" href="./Images/favicon.ico">
  <link rel="icon" href="./Images/favicon_gif.gif" type="image/gif" >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!-- Include the MQTT library via CDN -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

</head>
<body onload="load()">
  <!--to hide loading-->
  <div id="cover">
    <img src="./Images/revive_logo.png" 
    style="width: 80vmin; height: 80vmin; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); filter: brightness(1.2) contrast(1.5);">
  </div>

  <!--Toolbar on top-->
  <div id="topBarContainer">
    <span class="topBarOption" style="background: rgb(179,179,179); border: none;">
      <img src="Images/revive_logo_gray.png" style="height: 100%;width: 100%;">
    </span>

    <span class="topBarOption" style="width: 100px;" id="saveFilesOption">Save files</span>
    <div id="saves">
      <button class="savefile" id="addSaveButton" onclick="addSaveFile()">Add new save</button>
      <button class="savefile" id="savefile0" data-id="0" style="background-color: #4a7a8a;">savefile 0</button>
    </div>

    <button class="topBarOption" id="exportSave" style="margin-left: 20px;">Export save</button>
    <button class="topBarOption" id="importSave" style="margin-right: 30px;">Import save</button>

    <button class="topBarOption" onclick="reset()">Reset</button>
  </div>

  <!--Counter Preview-->
  <div id="counterPreview">
    <button id="btnOpenDisplay">⇱</button>
    <span id="counter">23:46</span>
  </div>

  <!--Device options (like same/cross-device)-->
  <div id="deviceOptionsContainer">
    <button id="singleDeviceButton" class="deviceOption">Single-device mode</button>
    <button id="crossDeviceButton" class="deviceOption">Cross-device mode</button>
    <span id="displayUrlContainer">
      <span id="connectingStatus" style="color: yellow; font-weight: bold;">Connecting to broker...</span>
      Copy this link into a browser: <span id="displayUrl"></span></span>
    <button id="cancelDeviceButton" class="deviceOption">Cancel</button>
  </div>

  <!--Display settings-->
  <div id="displaySettings">
    <button class="displaySetting" id="hide" style="border-left: none !important;">hide</button>
    <button class="displaySetting" id="showMs">show ms</button>
    <button class="displaySetting" id="show%" style="background-color: blue; color: white;">show %</button>
    <button class="displaySetting" id="showEvent" style="background-color: blue; color: white;">show event</button>
    <button class="displaySetting" id="showColor" style="background-color: blue; color: white;">colored</button>
  </div>

  <!--Controls-->
  <div id="counterControlsContainer">
    <button class="counterControl" id="pauseTimer" style="border: none !important">❚❚</button>
    <button class="counterControl" id="subMinute">-1m</button>
    <button class="counterControl" id="addMinute">+1m</button>
    <button class="counterControl" id="resetTimer">Reset Timer</button>
    <button class="counterControl" id="nextTimer">Next Timer</button>
    <button class="counterControl" id="setNewTime">Set Time</button>
  </div>
  <!--Message box-->
  <div id="messageBox">Show Message: <input type="text" id="messageText">
    <button id="messageSet">Set</button>
    <button id="messageClear">Clear</button>
    <button id="messageMaximize">Maximize</button>
  </div>

  <!--Timers-->
  <div id="timerContainer">
    <div id="timerTopBar">
      Scheduled timers
      <button id="addTimer">+</button>
    </div>

    <div id="timerOrderingContainer">
      <div id="timerOrdering">
        <!--Example timer-->
        <div class="orderedTimer" draggable="true" data-id="0">
          <span class="timerName">Timer 1</span>
          <span class="timerTime">5m</span>
          <div class="timerButtons">
            <button class="timerStartBtn timerSetting" onclick="startTimer(this)">▶</button>
            <button class="timerEditBtn timerSetting" onclick="openTimerEditor(this)">✎</button>
            <button class="timerDeleteBtn timerSetting" onclick="deleteTimer(this)"><img class="timerDeleteIcon" src="Images/bin.png"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!--Timer Editor-->
  <div id="timerEditorContainer">
    <span style="border-style: none none solid none; padding: 3px;">
      Editing 
      <input type="text" value="Timer 1" id="timerEditorTitle"></span>
    </span>
    <button id="closeTimerEditor" onclick="closeTimerEditor()">X</button>

    <span style="margin-top: 20px;">
      Duration: <input type="time" value="00:05:00" step="1" id="timerEditorDuration">
    </span>

    <span style="margin-top: 30px;">
      Auto start <select name="autoStartType" id="autoStartingType" value="0">
        <option value="0">Never</option>
        <option value="1">At time</option>
        <option value="2">After previous</option>
        <option value="3">Either</option>
      </select>
    </span>
    <div id="editorStartTimeContainer" style="margin-top: 10px; display: none;">
      Start time <input type="time" value="19:00" step="60" id="timerEditorStartTime">
    </div>
  </div>

  <script src="JavaScript/constants.js"></script>
  <script src="JavaScript/counter.js"></script>
  <script src="JavaScript/main/display.js"></script>
  <script src="JavaScript/main/timers.js"></script>
  <script src="JavaScript/main/main.js"></script>
</body>
</html>
